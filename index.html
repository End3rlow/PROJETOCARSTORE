                    <textarea name="descricao" id="descricao" placeholder="Faça a descrição do seu veículo"></textarea>
                </div>
                <div>
                    <label for="Marca">Marca<span>*</span></label>
                    <input type="text" name="Marca" id="Marca" placeholder="Marca do seu veiculo">
                </div>
                <div>
                    <label for="modelo">modelo <span>*</span></label>
                    <input type="text" name="modelo" ="modelo" placeholder="Modelo do seu veículo"></textarea>
                </div>
                <div>
                     <div>
                    <label for="Kilometragem">Kilometragem<span>*</span></label>
                   <input type="number" name="Kilometragem" id="Kilometragem" placeholder="Kilometragem do seu veiculo">
                </div>
                     <label for="data de compra">Data de compra <span>*</span></label>
                    <input type="date" name="data-de-compra" id="Datadecompra"
                </div>
            </form>
        </div>
    </div>
